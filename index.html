<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Hentai</title>
    <style>
        :root {
            --dark-bg: #121212;
            --darker-bg: #1e1e1e;
            --card-bg: #242424;
            --accent-color: #3a86ff;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header h1 {
            font-weight: 300;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: white;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 0;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .gallery-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }
        
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-color);
        }
        
        .gallery-card a {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
        
        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 1.2rem;
        }
        
        .card-title {
            font-size: 1rem;
            margin: 0;
            color: white;
            font-weight: 500;
        }
        
        .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 3rem;
            flex-wrap: wrap;
        }
        
        .pagination {
            display: flex;
            margin: 0 1rem;
        }
        
        .pagination a, .page-input-container {
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            text-decoration: none;
            border: 1px solid var(--border-color);
            margin: 0 0.2rem;
            border-radius: 6px;
            min-width: 15px;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        
        .pagination a.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        .pagination a:not(.active):hover {
            background-color: var(--darker-bg);
            border-color: var(--accent-color);
        }
        
        .page-input-container {
            display: flex;
            padding: 0;
            border: none;
            margin: 0 0.5rem;
        }
        
        .page-input {
            width: 50px;
            padding: 0.6rem;
            text-align: center;
            background-color: var(--darker-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px 0 0 6px;
            color: var(--text-primary);
            outline: none;
        }
        
        .page-input:focus {
            border-color: var(--accent-color);
        }
        
        .go-button {
            padding: 0 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .go-button:hover {
            background-color: #2a75e6;
        }
        
        .nav-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        
        .nav-arrow:hover {
            background-color: var(--darker-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
            
            .pagination-container {
                flex-direction: column;
            }
            
            .pagination {
                margin-bottom: 1rem;
                order: 1;
            }
            
            .page-input-container {
                order: 2;
                margin: 0.5rem 0;
            }
            
            .nav-arrows {
                order: 3;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Manga Hentai</h1>
            <p>Jelajahi koleksi manga hentai kami yang dipilih secara khusus</p>
        </div>
        
        <div class="gallery-grid">
            <!-- Item 1-10 -->
            <div class="gallery-card">
                <a href="1/index.html">
                    <img src="https://files.fm/thumb.php?i=8x8xdwphn8" alt="Hypnosis App" class="card-image">
                    <div class="card-content">
                        <h3 class="card-title">Hypnosis App</h3>
                        <div class="card-meta">Manga • 40 Foto</div>
                    </div>
                </a>
            </div>
            
        </div>

        <div class="pagination-container">
            <div class="pagination">
                <a href="index.html" class="active">1</a>
                <a href="page2/index.html">2</a>
                <a href="page3/index.html">3</a>
                <a href="page4/index.html">4</a>
                <span class="page-input-container">
                    <input type="number" class="page-input" min="1" placeholder="...">
                    <button class="go-button" onclick="goToPage()">Go</button>
                </span>
            </div>
            <div class="nav-arrows">
                <a href="page2/index.html" class="nav-arrow">&raquo;</a>
            </div>
        </div>
    </div>

    <script>
        function goToPage() {
            const pageInput = document.querySelector('.page-input');
            const pageNumber = parseInt(pageInput.value);
            
            if (pageNumber && pageNumber > 0) {
                window.location.href = `koleksi${pageNumber}/index.html`;
            } else {
                alert('Masukkan nomor halaman yang valid');
                pageInput.focus();
            }
        }

        // Tambahkan event listener untuk tombol Enter
        document.querySelector('.page-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                goToPage();
            }
        });
    </script>
</body>
</html>
